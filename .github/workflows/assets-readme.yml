name: Update WordPress.org assets and readme

# Listing-only. Manual so a version bump on main cannot point Stable tag
# at a tag folder that does not exist yet. Run after the version tag has shipped.
on:
  workflow_dispatch:

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: WordPress.org plugin asset/readme update
        uses: 10up/action-wordpress-plugin-asset-update@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: at-search-console
